[package]
name = "phantom"
version = "0.1.0"
edition = "2021"
description = "Censorship-resistant tunnel application"
license = "MIT"

[dependencies]
quinn = "0.11"
kcp = "0.5"
ring = "0.17"
tokio = { version = "1", features = ["full"] }
tokio-socks = "0.5"
nostr-sdk = "0.37"
h3 = "0.0.6"
h3-quinn = "0.0.7"
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
rand = "0.8"
rand_distr = "0.4"
rustls = "0.23"
rustls-native-certs = "0.8"
reqwest = { version = "0.12", features = ["json", "http3", "rustls-tls"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
